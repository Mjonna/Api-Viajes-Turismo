{% extends "base.html" %}

{% block titulo %}Login{% endblock %}
{% block encabezado %}Iniciar sesión{% endblock %}

{% block contenido %}
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Entrar</button>
</form>
{% if form.errors %}
<p>Usuario o contraseña incorrectos. Inténtalo nuevamente.</p>
{% endif %}
{% endblock %}
